name: CI - Bundle, Tests & Quality

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  start-test-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Security audit
        run: npm audit --audit-level=high

      - name: Bundle check
        run: npx expo export --platform android --output-dir /tmp/expo-export
          
      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Tests with Coverage
        run: npm test -- --coverage
