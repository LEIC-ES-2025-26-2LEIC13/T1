appId: com.anonymous.LEICo
tags:
  - task
  
---
- launchApp:
    clearState: true


- runFlow:
    file: subflows/createColumn.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      PROJECT_TITLE: ${PROJECT_TITLE}
      PROJECT_DESCRIPTION: ${PROJECT_DESCRIPTION}
      COLUMN_NAME: ${COLUMN_NAME}
        

- tapOn: "+, Create Task"
- tapOn: "Enter task name"
- inputText: "Task1"
- tapOn: "Enter task description"
- inputText: "Task1 Description"
- hideKeyboard
- tapOn: "Cancel"
- assertNotVisible: "Task1"
- assertNotVisible: "Task1 Description"