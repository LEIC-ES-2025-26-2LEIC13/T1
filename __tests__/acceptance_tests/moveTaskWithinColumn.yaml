appId: com.anonymous.LEICo
tags:
    - task
    - column
env:
    EMAIL: "johndoe@gmail.com"
    PASSWORD: "123456"
    PROJECT_TITLE: "Test-Move-Task-Within-Column"
    PROJECT_DESCRIPTION: "Description"
    COLUMN_NAME: "In-Progress"
    TASK1_NAME: "Task1-Name"
    TASK2_NAME: "Task2-Name"
---
- launchApp:
    clearState: true

- runFlow:
    file: subflows/createColumn.yaml
    env:
        EMAIL: ${EMAIL}
        PASSWORD: ${PASSWORD}
        PROJECT_TITLE: ${PROJECT_TITLE}
        PROJECT_DESCRIPTION: ${PROJECT_DESCRIPTION}
        COLUMN_NAME: ${COLUMN_NAME}

# Create first task
- tapOn:
    id: "open-create-task-modal-button"
- tapOn: "Enter task name"
- inputText: ${TASK1_NAME}
- hideKeyboard
- tapOn:
    id: "create-task-modal-actions-create"

# Create second task
- tapOn:
    id: "open-create-task-modal-button"
- tapOn: "Enter task name"
- inputText: ${TASK2_NAME}
- hideKeyboard
- tapOn:
    id: "create-task-modal-actions-create"

# Task1 is the first task of the column and Task2 is the second task
- assertVisible:
    id: "task-${TASK1_NAME}-0"
- assertVisible:
    id: "task-${TASK2_NAME}-1"

# Drag Task1 to stay below Task2
- swipe:
    from:
        id: "task-${TASK1_NAME}-0"
    direction: DOWN
    duration: 15000

# Assert that Task2 is above Task1 in the column
- assertVisible:
    id: "task-${TASK2_NAME}-0"
- assertVisible:
    id: "task-${TASK1_NAME}-1"
