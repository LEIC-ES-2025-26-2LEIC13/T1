appId: com.anonymous.LEICo
tags:
    - task

env:
    EMAIL: "johndoe@gmail.com"
    PASSWORD: "123456"
    PROJECT_TITLE: "Test-View-Personal-Task-List"
    PROJECT_DESCRIPTION: "Description"
    COLUMN_NAME: "Column-Name"
    TASK_NAME: "Task-Name"
    TASK_DESCRIPTION: "Task-Description"
---
- launchApp:
    clearState: true

- runFlow:
    file: subflows/createTask.yaml
    env:
        EMAIL: ${EMAIL}
        PASSWORD: ${PASSWORD}
        PROJECT_TITLE: ${PROJECT_TITLE}
        PROJECT_DESCRIPTION: ${PROJECT_DESCRIPTION}
        COLUMN_NAME: ${COLUMN_NAME}
        TASK_NAME: ${TASK_NAME}
        TASK_DESCRIPTION: ${TASK_DESCRIPTION}

- tapOn:
    id: "project-arrow-back"
- tapOn:
    id: "drawer-hamburger-button"
- assertVisible:
    id: "tasks-drawer-screen"
- assertVisible: ${TASK_NAME}
- assertVisible: ${TASK_DESCRIPTION}
