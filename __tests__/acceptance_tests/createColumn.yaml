appId: com.anonymous.LEICo
tags:
    - project
    - column
env:
    EMAIL: "johndoe@gmail.com"
    PASSWORD: "123456"
    PROJECT_TITLE: "Test-Create-Column"
    PROJECT_DESCRIPTION: "Description"
    COLUMN_NAME: "Column-Name"

---
- launchApp:
    clearState: true

- runFlow:
    file: subflows/openProject.yaml
    env:
        EMAIL: ${EMAIL}
        PASSWORD: ${PASSWORD}
        PROJECT_TITLE: ${PROJECT_TITLE}
        PROJECT_DESCRIPTION: ${PROJECT_DESCRIPTION}
        
- tapOn:
    id: "open-create-column-modal-button"
- tapOn: "Enter column name"
- inputText: ${COLUMN_NAME}
- tapOn:
    id: "create-column-modal-actions-create"
- assertVisible: ${COLUMN_NAME}
- assertVisible: "No tasks yet"
- assertVisible: "Create the first task in this column using the button below"
