appId: com.anonymous.LEICo
tags:
  - project
---
- runFlow:
    file: openProject.yaml
    env:
        EMAIL: ${EMAIL}
        PASSWORD: ${PASSWORD}
        PROJECT_TITLE: ${PROJECT_TITLE}
        PROJECT_DESCRIPTION: ${PROJECT_DESCRIPTION}

- tapOn: "\uf49f" # See Members icon
- assertVisible: "Project Members"
- assertVisible: "Me (${EMAIL})"
