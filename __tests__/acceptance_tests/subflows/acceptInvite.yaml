appId: com.anonymous.LEICo
tags:
    - invite
---
- runFlow:
    file: inviteUser.yaml
    env:
        SENDER_EMAIL: ${SENDER_EMAIL}
        SENDER_PASSWORD: ${SENDER_PASSWORD}
        PROJECT_TITLE: ${PROJECT_TITLE}
        PROJECT_DESCRIPTION: ${PROJECT_DESCRIPTION}
        RECEIVER_EMAIL: ${RECEIVER_EMAIL}
        RECEIVER_PASSWORD: ${RECEIVER_PASSWORD}
- copyTextFrom:
    id: project-title # copy project title
- tapOn:
    id: "invite-card-accept"
- assertVisible: "No pending invites"
- tapOn:
    id: "drawer-hamburger-button"
- tapOn:
    id: "home-drawer-screen"
- assertVisible: ${maestro.copiedText} # check if the project is in the user's projects
